services:
  - type: web
    name: fundco-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_TOOLS_VISIBLE
        value: "false"
      # - key: ANTHROPIC_MODEL   (optional override, defaults to claude-sonnet-5)
      # - key: SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS   (optional, see docs/AUDIT_REPORT.md)
      # - key: PINATA_JWT   (optional — file storage is currently hidden, not required)
      # - key: ZOOM_ACCOUNT_ID / ZOOM_CLIENT_ID / ZOOM_CLIENT_SECRET   (optional — meetings hidden)
      # - key: FIREBASE_CREDENTIALS   (optional — push notifications hidden)

  - type: web
    name: fundco-admin-backend
    runtime: node
    plan: free
    rootDir: adminpanel/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: USER_BACKEND_INTERNAL_TOKEN
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: USER_API_URL
        sync: false
